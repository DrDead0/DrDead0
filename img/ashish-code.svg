<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <style>
      .mono {
        font-family: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
      }

      .ln {
        fill: #6e7681;
        font-size: 14px;
        text-anchor: end;
      }

      .code {
        font-size: 14px;
      }

      .keyword {
        fill: #ff7b72;
      }

      .variable {
        fill: #d2a8ff;
      }

      .property {
        fill: #79c0ff;
      }

      .string {
        fill: #a5d6ff;
      }

      .punct {
        fill: #c9d1d9;
      }

      .comment {
        fill: #8b949e;
      }

      .title {
        fill: #c9d1d9;
        font-size: 13px;
      }

      .tab {
        fill: #e6edf3;
        font-size: 13px;
      }

      .status {
        fill: #c9d1d9;
        font-size: 11px;
      }
