<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Dracula themed VS Code profile card">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <style>
      .ui {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .mono {
        font-family: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
      }

      .ln {
        fill: #6272A4;
        font-size: 11px;
        text-anchor: end;
      }

      .crumb {
        fill: #6272A4;
        font-size: 10px;
      }

      .code {
        font-size: 13px;
      }

      .kw { fill: #FF79C6; }
      .var { fill: #50FA7B; }
      .prop { fill: #8BE9FD; }
      .str { fill: #F1FA8C; }
      .punc { fill: #F8F8F2; }
      .comment { fill: #6272A4; }
      .tabtext { fill: #F8F8F2; }
      .status { fill: #F8F8F2; font-size: 10px; }
      .muted { fill: #6272A4; }
    </style>
  </defs>

  <!-- outer window -->
  <rect x="4" y="4" width="992" height="552" rx="5" fill="#282A36" stroke="#3B3E4A" filter="url(#shadow)"/>

  <!-- top bar -->
  <rect x="4" y="4" width="992" height="36" rx="5" fill="#21222C"/>
  <rect x="4" y="35" width="992" height="1" fill="#3B3E4A"/>

  <!-- mac controls -->
  <circle cx="22" cy="22" r="5.5" fill="#FF5555"/>
  <circle cx="40" cy="22" r="5.5" fill="#F1FA8C"/>
  <circle cx="58" cy="22" r="5.5" fill="#50FA7B"/>

  <text x="500" y="25" text-anchor="middle" class="ui" font-size="12" fill="#BD93F9">ashish.ts — Visual Studio Code</text>

  <!-- activity bar -->
  <rect x="4" y="40" width="44" height="492" fill="#21222C"/>
  <g fill="#6D6F78">
    <rect x="17" y="60" width="18" height="18" rx="2"/>
    <rect x="17" y="95" width="18" height="18" rx="2"/>
    <circle cx="26" cy="136" r="9"/>
    <rect x="17" y="160" width="18" height="18" rx="2"/>
  </g>

  <!-- explorer -->
  <rect x="48" y="40" width="174" height="492" fill="#232530"/>
  <text x="61" y="60" class="ui" font-size="10" fill="#6272A4">EXPLORER</text>
  <text x="61" y="85" class="ui" font-size="12" fill="#F8F8F2">▾ PROFILE</text>
  <rect x="48" y="95" width="174" height="24" fill="#343746"/>
  <text x="64" y="111" class="mono" font-size="12" fill="#8BE9FD">TS</text>
  <text x="88" y="111" class="ui" font-size="12" fill="#F8F8F2">ashish.ts</text>
  <text x="64" y="138" class="mono" font-size="11" fill="#6272A4">MD</text>
  <text x="88" y="138" class="ui" font-size="12" fill="#6272A4">README.md</text>
  <text x="64" y="165" class="mono" font-size="11" fill="#6272A4">{ }</text>
  <text x="94" y="165" class="ui" font-size="12" fill="#6272A4">systems.json</text>

  <!-- editor top tabs -->
  <rect x="222" y="40" width="774" height="34" fill="#21222C"/>
  <rect x="222" y="40" width="152" height="34" fill="#282A36"/>
  <rect x="222" y="72" width="152" height="2" fill="#BD93F9"/>
  <text x="238" y="61" class="mono" font-size="12" fill="#8BE9FD">TS</text>
  <text x="262" y="61" class="ui tabtext" font-size="12">ashish.ts</text>
  <text x="352" y="61" class="ui" font-size="12" fill="#6272A4">×</text>

  <!-- breadcrumbs -->
  <rect x="222" y="74" width="774" height="24" fill="#2A2D39"/>
  <text x="236" y="90" class="ui crumb">PROFILE  ›  ashish.ts  ›  ashish</text>

  <!-- editor -->
  <rect x="222" y="98" width="774" height="406" fill="#282A36"/>

  <!-- line numbers -->
  <g class="mono ln">
    <text x="262" y="122">1</text>
    <text x="262" y="143">2</text>
    <text x="262" y="164">3</text>
    <text x="262" y="185">4</text>
    <text x="262" y="206">5</text>
    <text x="262" y="227">6</text>
    <text x="262" y="248">7</text>
    <text x="262" y="269">8</text>
    <text x="262" y="290">9</text>
    <text x="262" y="311">10</text>
    <text x="262" y="332">11</text>
    <text x="262" y="353">12</text>
    <text x="262" y="374">13</text>
    <text x="262" y="395">14</text>
    <text x="262" y="416">15</text>
    <text x="262" y="437">16</text>
    <text x="262" y="458">17</text>
    <text x="262" y="479">18</text>
    <text x="262" y="500">19</text>
  </g>

  <!-- subtle indent guides -->
  <g stroke="#3A3D4A" stroke-width="1">
    <line x1="316" y1="128" x2="316" y2="482"/>
    <line x1="340" y1="170" x2="340" y2="462"/>
  </g>

  <!-- code -->
  <g class="mono code">
    <text x="282" y="122"><tspan class="kw">const</tspan><tspan class="var"> ashish</tspan><tspan class="punc"> = {</tspan></text>

    <text x="306" y="143"><tspan class="prop">role</tspan><tspan class="punc">: </tspan><tspan class="str">"Systems Engineer &amp; Backend Developer"</tspan><tspan class="punc">,</tspan></text>

    <text x="306" y="164"><tspan class="prop">building</tspan><tspan class="punc">: [</tspan></text>
    <text x="330" y="185"><tspan class="str">"Scalable Backend Systems"</tspan><tspan class="punc">,</tspan></text>
    <text x="330" y="206"><tspan class="str">"Distributed Services"</tspan><tspan class="punc">,</tspan></text>
    <text x="330" y="227"><tspan class="str">"System-Level Software"</tspan></text>
    <text x="306" y="248"><tspan class="punc">],</tspan></text>

    <text x="306" y="269"><tspan class="prop">stack</tspan><tspan class="punc">: {</tspan></text>
    <text x="330" y="290"><tspan class="prop">backend</tspan><tspan class="punc">: [</tspan><tspan class="str">"TypeScript", "Node.js", "Express", "Go", "Gin"</tspan><tspan class="punc">],</tspan></text>
    <text x="330" y="311"><tspan class="prop">systems</tspan><tspan class="punc">: [</tspan><tspan class="str">"C", "C++", "Linux"</tspan><tspan class="punc">],</tspan></text>
    <text x="330" y="332"><tspan class="prop">databases</tspan><tspan class="punc">: [</tspan><tspan class="str">"PostgreSQL", "MongoDB", "Redis"</tspan><tspan class="punc">],</tspan></text>
    <text x="330" y="353"><tspan class="prop">infrastructure</tspan><tspan class="punc">: [</tspan><tspan class="str">"Docker", "Kubernetes", "AWS", "GCP"</tspan><tspan class="punc">]</tspan></text>
    <text x="306" y="374"><tspan class="punc">},</tspan></text>

    <text x="306" y="395"><tspan class="prop">currentlyExploring</tspan><tspan class="punc">: [</tspan></text>
    <text x="330" y="416"><tspan class="str">"Distributed Systems"</tspan><tspan class="punc">,</tspan></text>
    <text x="330" y="437"><tspan class="str">"Networking"</tspan><tspan class="punc">,</tspan></text>
    <text x="330" y="458"><tspan class="str">"Concurrency"</tspan><tspan class="punc">,</tspan></text>
    <text x="330" y="479"><tspan class="str">"Performance Engineering"</tspan></text>

    <text x="306" y="500"><tspan class="punc">],</tspan><tspan class="comment">  // still shipping while exploring</tspan></text>

    <text x="306" y="521"><tspan class="prop">mindset</tspan><tspan class="punc">: </tspan><tspan class="str">"Understand the system. Find the bottleneck. Engineer it better."</tspan></text>
  </g>

  <!-- minimap -->
  <g opacity="0.24">
    <rect x="965" y="118" width="22" height="4" fill="#FF79C6"/>
    <rect x="959" y="131" width="28" height="4" fill="#F1FA8C"/>
    <rect x="963" y="144" width="24" height="4" fill="#8BE9FD"/>
    <rect x="958" y="157" width="29" height="4" fill="#F1FA8C"/>
    <rect x="961" y="170" width="26" height="4" fill="#F1FA8C"/>
    <rect x="957" y="183" width="30" height="4" fill="#F1FA8C"/>
    <rect x="962" y="248" width="25" height="4" fill="#8BE9FD"/>
    <rect x="957" y="261" width="30" height="4" fill="#F1FA8C"/>
    <rect x="961" y="274" width="26" height="4" fill="#F1FA8C"/>
    <rect x="960" y="287" width="27" height="4" fill="#BD93F9"/>
  </g>

  <!-- status bar -->
  <rect x="4" y="504" width="992" height="26" fill="#44475A"/>
  <text x="16" y="521" class="ui status">main*</text>
  <text x="800" y="521" class="ui status">UTF-8</text>
  <text x="846" y="521" class="ui status">LF</text>
  <text x="874" y="521" class="ui status">TypeScript</text>
  <text x="955" y="521" class="ui status">✓</text>

  <!-- bottom footer -->
  <rect x="4" y="530" width="992" height="26" fill="#21222C" rx="0"/>
  <text x="16" y="546" class="ui" font-size="10" fill="#6272A4">Problems 0</text>
  <text x="910" y="546" class="ui" font-size="10" fill="#6272A4">Ln 19, Col 1</text>
</svg>
