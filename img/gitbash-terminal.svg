        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.653793;0.657931;0.795862;0.799172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="ok">✓</tspan>
      <tspan class="out"> workers stable</tspan>

      <tspan class="ok">   ✓</tspan>
      <tspan class="out"> metrics live</tspan>

      <tspan class="ok">   ✓</tspan>
      <tspan class="out"> traces flowing</tspan>
    </text>

    <text x="24" y="176" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.666207;0.670345;0.795862;0.799172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="muted">deploy:</tspan>
      <tspan class="ok"> success</tspan>

      <tspan class="muted"> · rollback:</tspan>
      <tspan class="out"> unnecessary</tspan>
    </text>

  </g>


  <!-- SCENE 5 -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.799172;0.8;0.995862;1"
      dur="14.5s"
      repeatCount="indefinite"
    />

    <text
      x="24"
      y="100"
      class="mono cmd"
      font-size="15"
      clip-path="url(#cmd5)">
      tail -n 3 /var/log/build.log
