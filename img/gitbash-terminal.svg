    <text x="24" y="128" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.841379;0.845517;0.995862;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="muted">[info]</tspan>
      <tspan class="out"> bottleneck found → fixed</tspan>
    </text>

    <text x="24" y="152" class="mono" font-size="14" opacity="0">
      <animate
