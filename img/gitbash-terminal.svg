<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="215"
     viewBox="0 0 1000 215"
     role="img">

  <defs>

    <filter
      id="shadow"
      x="-10%"
      y="-20%"
      width="120%"
      height="150%">

      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity="0.35"
      />

    </filter>


    <style>

      .mono {
        font-family:
          "Cascadia Mono",
          "JetBrains Mono",
          "Fira Code",
          Consolas,
          monospace;
      }

      .user {
        fill: #7ee787;
      }

      .mingw {
        fill: #d2a8ff;
      }

      .path {
        fill: #f2cc60;
      }

      .command {
        fill: #f0f6fc;
      }

      .output {
        fill: #79c0ff;
      }

      .success {
        fill: #56d364;
      }

      .muted {
        fill: #8b949e;
      }


      .cursor {

        fill: #f0f6fc;

        animation:
          blink 1s steps(1, end) infinite;

      }


      @keyframes blink {

        0%,
        48% {
          opacity: 1;
        }

        49%,
        100% {
          opacity: 0;
        }

      }

    </style>

  </defs>


  <!-- TERMINAL WINDOW -->

  <rect
    x="8"
    y="8"
    width="984"
    height="199"
    rx="9"
    fill="#0c0c0c"
    stroke="#343434"
    filter="url(#shadow)"
  />


  <!-- WINDOWS TITLE BAR -->

  <path
    d="
      M17 8
      H983
      A9 9 0 0 1 992 17
      V47
      H8
      V17
      A9 9 0 0 1 17 8
    "
    fill="#1f1f1f"
  />


  <text
    x="27"
    y="33"
    class="mono"
    font-size="13"
    fill="#dedede">
    MINGW64:/c/Users/Ashish/systems
  </text>


  <!-- WINDOWS BUTTONS -->

  <line
    x1="902"
    y1="28"
    x2="915"
    y2="28"
    stroke="#d7d7d7"
    stroke-width="1.3"
  />


  <rect
    x="934"
    y="22"
    width="11"
    height="11"
    fill="none"
    stroke="#d7d7d7"
    stroke-width="1.3"
  />


  <line
    x1="968"
    y1="22"
    x2="980"
    y2="34"
    stroke="#d7d7d7"
    stroke-width="1.3"
  />


  <line
    x1="980"
    y1="22"
    x2="968"
    y2="34"
    stroke="#d7d7d7"
    stroke-width="1.3"
  />


  <!-- SHELL -->

  <text
    x="30"
    y="77"
    class="mono"
    font-size="15">

    <tspan class="user">
      ashish@dev
    </tspan>

    <tspan fill="#d9d9d9">
      :
    </tspan>

    <tspan class="path">
      ~/systems
    </tspan>

    <tspan fill="#d9d9d9">
      $
    </tspan>

  </text>


  <!-- SYSTEMCTL -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="1;1;0;0;0;0"
      keyTimes="0;0.17;0.20;0.40;0.80;1"
      dur="22s"
      repeatCount="indefinite"
    />


    <text
      x="30"
      y="108"
      class="mono command"
      font-size="15">

      systemctl --user status ashish.service

    </text>


    <text
      x="30"
      y="137"
      class="mono"
      font-size="14">

      <tspan class="success">
        ● ashish.service
      </tspan>

      <tspan class="output">
        — Systems &amp; Backend Engineering
      </tspan>

    </text>


    <text
      x="30"
      y="162"
      class="mono"
      font-size="14">

      <tspan class="muted">
        Active:
      </tspan>

      <tspan class="success">
        active (running)
      </tspan>

      <tspan class="muted">
        · uptime: ∞
      </tspan>

    </text>


    <text
      x="30"
      y="187"
      class="mono"
      font-size="14">

      <tspan class="muted">
        Services:
      </tspan>

      <tspan class="output">
        APIs · distributed systems · infrastructure
      </tspan>

    </text>

  </g>


  <!-- HEALTH CHECK -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.19;0.20;0.37;0.40;1"
      dur="22s"
      repeatCount="indefinite"
    />


    <text
      x="30"
      y="108"
      class="mono command"
      font-size="15">

      curl -s localhost:8080/health | jq

    </text>


    <text
      x="30"
      y="140"
      class="mono"
      font-size="14">

      <tspan class="output">
        {
      </tspan>

      <tspan class="output">
        "status":
      </tspan>

      <tspan class="success">
        "healthy"
      </tspan>

      <tspan class="output">
        ,
      </tspan>

      <tspan class="output">
        "latency":
      </tspan>

      <tspan class="success">
        "18ms"
      </tspan>

      <tspan class="output">
        ,
      </tspan>

      <tspan class="output">
        "coffee":
      </tspan>

      <tspan class="success">
        true
      </tspan>

      <tspan class="output">
        }
      </tspan>

    </text>


    <text
      x="30"
      y="174"
      class="mono"
      font-size="14">

      <tspan class="muted">
        // HTTP 418 remains an acceptable debugging strategy.
      </tspan>

    </text>

  </g>


  <!-- GIT LOG -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.39;0.40;0.57;0.60;1"
      dur="22s"
      repeatCount="indefinite"
    />


    <text
      x="30"
      y="108"
      class="mono command"
      font-size="15">

      git log --oneline -3

    </text>


    <text
      x="30"
      y="137"
      class="mono"
      font-size="14">

      <tspan class="path">
        a11ce42
      </tspan>

      <tspan class="output">
        feat: scale the backend without scaling the drama
      </tspan>

    </text>


    <text
      x="30"
      y="162"
      class="mono"
      font-size="14">

      <tspan class="path">
        b4c0ffe
      </tspan>

      <tspan class="output">
        perf: shave a few ms off the hot path
      </tspan>

    </text>


    <text
      x="30"
      y="187"
      class="mono"
      font-size="14">

      <tspan class="path">
        d00df00
      </tspan>

      <tspan class="output">
        fix: one bug down, three dashboards up
      </tspan>

    </text>

  </g>


  <!-- SHIP -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.59;0.60;0.77;0.80;1"
      dur="22s"
      repeatCount="indefinite"
    />


    <text
      x="30"
      y="108"
      class="mono command"
      font-size="15">

      ./ship --service backend --mode reliable

    </text>


    <text
      x="30"
      y="138"
      class="mono"
      font-size="14">

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        API ready
      </tspan>

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        database connected
      </tspan>

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        cache warm
      </tspan>

    </text>


    <text
      x="30"
      y="164"
      class="mono"
      font-size="14">

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        metrics live
      </tspan>

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        traces flowing
      </tspan>

      <tspan class="success">
        ✓
      </tspan>

      <tspan class="output">
        ship it
      </tspan>

    </text>


    <text
      x="30"
      y="190"
      class="mono"
      font-size="14">

      <tspan class="muted">
        deploy:
      </tspan>

      <tspan class="success">
        success
      </tspan>

      <tspan class="muted">
        // no servers were harmed*
      </tspan>

    </text>

  </g>


  <!-- EASTER EGG -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.79;0.80;1"
      dur="22s"
      repeatCount="indefinite"
    />


    <text
      x="30"
      y="108"
      class="mono command"
      font-size="15">

      grep -R "TODO" ~/brain 2&gt;/dev/null

    </text>


    <text
      x="30"
      y="138"
      class="mono"
      font-size="14">

      <tspan class="output">
        TODO:
      </tspan>

      <tspan class="muted">
        sleep
      </tspan>

    </text>


    <text
      x="30"
      y="164"
      class="mono"
      font-size="14">

      <tspan class="output">
        TODO:
      </tspan>

      <tspan class="muted">
        stop saying "one last refactor"
      </tspan>

    </text>


    <text
      x="30"
      y="190"
      class="mono"
      font-size="14">

      <tspan class="success">
        0 critical bugs found.
      </tspan>

      <tspan class="muted">
        suspiciously quiet.
      </tspan>

    </text>

  </g>


  <!-- CURSOR -->

  <rect
    x="30"
    y="193"
    width="8"
    height="14"
    rx="1"
    class="cursor"
  />

</svg>
