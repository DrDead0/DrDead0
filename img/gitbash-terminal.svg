<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Animated Git Bash terminal">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <style>
      .mono {
        font-family: "Cascadia Code","JetBrains Mono","Fira Code",Consolas,monospace;
      }

      .title { fill:#f8f8f2; font-size:13px; }
      .user { fill:#50fa7b; }
      .path { fill:#f1fa8c; }
      .cmd { fill:#f8f8f2; }
      .out { fill:#8be9fd; }
      .ok { fill:#50fa7b; }
      .warn { fill:#ffb86c; }
      .muted { fill:#9aa6d1; }

      .cursor {
        fill:#f8f8f2;
        animation: blink .8s steps(1,end) infinite;
      }

      @keyframes blink {
        0%,48% { opacity:1; }
        49%,100% { opacity:0; }
      }
    </style>

    <!-- COMMAND 1 TYPING -->
    <clipPath id="cmd1">
      <rect x="24" y="84" height="24" width="0">
        <animate
          attributeName="width"
          values="0;0;380;380;0;0"
          keyTimes="0;0.000828;0.033103;0.195862;0.199172;1"
          dur="14.5s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- COMMAND 2 TYPING -->
    <clipPath id="cmd2">
      <rect x="24" y="84" height="24" width="0">
        <animate
          attributeName="width"
          values="0;0;0;300;300;0;0"
          keyTimes="0;0.199172;0.2;0.233103;0.395862;0.399172;1"
          dur="14.5s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- COMMAND 3 TYPING -->
    <clipPath id="cmd3">
      <rect x="24" y="84" height="24" width="0">
        <animate
          attributeName="width"
          values="0;0;0;260;260;0;0"
          keyTimes="0;0.399172;0.4;0.433103;0.595862;0.599172;1"
          dur="14.5s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- COMMAND 4 TYPING -->
    <clipPath id="cmd4">
      <rect x="24" y="84" height="24" width="0">
        <animate
          attributeName="width"
          values="0;0;0;560;560;0;0"
          keyTimes="0;0.599172;0.6;0.633103;0.795862;0.799172;1"
          dur="14.5s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- COMMAND 5 TYPING -->
    <clipPath id="cmd5">
      <rect x="24" y="84" height="24" width="0">
        <animate
          attributeName="width"
          values="0;0;0;300;300;0"
          keyTimes="0;0.799172;0.8;0.833103;0.995862;1"
          dur="14.5s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>
  </defs>


  <!-- WINDOW -->

  <rect
    x="4"
    y="4"
    width="992"
    height="202"
    rx="4"
    fill="#2b2f3b"
    stroke="#49506a"
    filter="url(#shadow)"
  />

  <!-- TITLE BAR -->

  <rect
    x="4"
    y="4"
    width="992"
    height="34"
    rx="4"
    fill="#252836"
  />

  <rect
    x="4"
    y="34"
    width="992"
    height="1"
    fill="#49506a"
  />

  <!-- MACOS CONTROLS -->

  <circle cx="22" cy="22" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="22" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="22" r="5.5" fill="#27c93f"/>

  <text
    x="500"
    y="25"
    text-anchor="middle"
    class="mono title">
    Git Bash — ashish@dev — ~/systems
  </text>

  <!-- TERMINAL BODY -->

  <rect
    x="4"
    y="35"
    width="992"
    height="171"
    fill="#2b2f3b"
  />

  <!-- FIXED PROMPT -->

  <text
    x="24"
    y="69"
    class="mono"
    font-size="15">

    <tspan class="user">ashish@dev</tspan>
    <tspan fill="#f8f8f2">:</tspan>
    <tspan class="path">~/systems</tspan>
    <tspan fill="#f8f8f2">$</tspan>
  </text>


  <!-- SCENE 1 -->

  <g>

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.195862;0.199172;1"
      dur="14.5s"
      repeatCount="indefinite"
    />

    <text
      x="24"
      y="100"
      class="mono cmd"
      font-size="15"
      clip-path="url(#cmd1)">
      systemctl --user status ashish.service
    </text>

    <text x="24" y="128" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.041379;0.045517;0.195862;0.199172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="ok">● ashish.service</tspan>
      <tspan class="out"> — systems &amp; backend engineering</tspan>
    </text>

    <text x="24" y="152" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.053793;0.057931;0.195862;0.199172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="muted">Active:</tspan>
      <tspan class="ok"> active (running)</tspan>
      <tspan class="muted"> · uptime: 99.99%</tspan>
    </text>

    <text x="24" y="176" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.066207;0.070345;0.195862;0.199172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="muted">Focus:</tspan>
      <tspan class="out"> scalable backends · distributed services · system software</tspan>
    </text>

  </g>


  <!-- SCENE 2 -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.199172;0.2;0.395862;0.399172;1"
      dur="14.5s"
      repeatCount="indefinite"
    />

    <text
      x="24"
      y="100"
      class="mono cmd"
      font-size="15"
      clip-path="url(#cmd2)">
      curl -s localhost:8080/health | jq
