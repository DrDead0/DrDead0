    <text x="24" y="128" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.641379;0.645517;0.795862;0.799172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="ok">✓</tspan>
      <tspan class="out"> api ready</tspan>

      <tspan class="ok">   ✓</tspan>
      <tspan class="out"> db connected</tspan>

      <tspan class="ok">   ✓</tspan>
      <tspan class="out"> cache warm</tspan>
    </text>

    <text x="24" y="152" class="mono" font-size="14" opacity="0">
