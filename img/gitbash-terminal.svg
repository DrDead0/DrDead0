      values="0;0;1;1;0;0"
      keyTimes="0;0.599172;0.6;0.795862;0.799172;1"
      dur="14.5s"
      repeatCount="indefinite"
    />

    <text
      x="24"
      y="100"
      class="mono cmd"
      font-size="15"
      clip-path="url(#cmd4)">
      ./orchestrate --target backend --profile production
