      <tspan class="ok"> metrics ✓</tspan>
      <tspan class="ok"> traces ✓</tspan>
    </text>

    <text x="24" y="176" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.266207;0.270345;0.395862;0.399172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="warn">queue:</tspan>
      <tspan class="out"> calm</tspan>
      <tspan class="muted"> · pager:</tspan>
      <tspan class="out"> silent</tspan>
    </text>

  </g>


  <!-- SCENE 3 -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.399172;0.4;0.595862;0.599172;1"
      dur="14.5s"
      repeatCount="indefinite"
    />

    <text
      x="24"
      y="100"
      class="mono cmd"
      font-size="15"
      clip-path="url(#cmd3)">
      git log --oneline -3
    </text>

    <text x="24" y="128" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.441379;0.445517;0.595862;0.599172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="path">c0ffee7</tspan>
      <tspan class="out"> feat: make the backend scale without the drama</tspan>
    </text>

    <text x="24" y="152" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.453793;0.457931;0.595862;0.599172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="path">deadbe4</tspan>
      <tspan class="out"> perf: shave a few ms off the hot path</tspan>
    </text>

    <text x="24" y="176" class="mono" font-size="14" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.466207;0.470345;0.595862;0.599172;1"
        dur="14.5s"
        repeatCount="indefinite"
      />

      <tspan class="path">f00db42</tspan>
      <tspan class="out"> fix: one bug down, three dashboards up</tspan>
    </text>

  </g>


  <!-- SCENE 4 -->

  <g opacity="0">

    <animate
